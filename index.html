<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistenzarzt-Ranking | DACH</title>

    <!-- Performance: DNS-Prefetch for external APIs -->
    <link rel="dns-prefetch" href="//supabase.co" />
    <link rel="dns-prefetch" href="//gc.zgo.at" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Logo_assistenz_vector.svg" />
    <link rel="apple-touch-icon" href="/Logo_assistenz_vector.svg" />

    <!-- SEO -->
    <meta name="description" content="Anonyme Bewertungsplattform für Assistenzarztstellen in Deutschland, Österreich und der Schweiz. Kliniken vergleichen, Bewertungen lesen und schreiben." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://assistenz-ranking.de" />

    <!-- Open Graph (Fallback für alle Seiten) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Assistenz-Ranking" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://assistenz-ranking.de" />
    <meta property="og:title" content="Assistenzarzt-Ranking | DACH" />
    <meta property="og:description" content="Anonyme Bewertungen von Assistenzarztstellen in Deutschland, Österreich und der Schweiz. Kliniken vergleichen, Bewertungen lesen und schreiben." />
    <meta property="og:image" content="https://assistenz-ranking.de/Logo_screenshot.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Assistenzarzt-Ranking | DACH" />
    <meta name="twitter:description" content="Anonyme Bewertungen von Assistenzarztstellen in DACH. Kliniken ehrlich vergleichen." />
    <meta name="twitter:image" content="https://assistenz-ranking.de/Logo_screenshot.png" />

    <!-- Structured Data: Organization + WebSite + FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://assistenz-ranking.de/#organization",
          "name": "Assistenz-Ranking",
          "url": "https://assistenz-ranking.de",
          "logo": {
            "@type": "ImageObject",
            "url": "https://assistenz-ranking.de/Logo_screenshot.png"
          },
          "description": "Anonyme Bewertungsplattform für Assistenzarztstellen in Deutschland, Österreich und der Schweiz.",
          "areaServed": ["DE", "AT", "CH"],
          "knowsAbout": ["Assistenzarzt", "Weiterbildung", "Klinikbewertung", "DACH"]
        },
        {
          "@type": "WebSite",
          "@id": "https://assistenz-ranking.de/#website",
          "url": "https://assistenz-ranking.de",
          "name": "Assistenz-Ranking",
          "description": "Anonyme Bewertungen von Assistenzarztstellen in Deutschland, Österreich und der Schweiz.",
          "publisher": { "@id": "https://assistenz-ranking.de/#organization" },
          "inLanguage": "de-DE",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://assistenz-ranking.de/berichte?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://assistenz-ranking.de/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Was ist das Assistenz-Ranking?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Das Assistenz-Ranking ist eine anonyme Bewertungsplattform für Assistenzarztstellen in Deutschland, Österreich und der Schweiz (DACH). Ärzt*innen können Kliniken und Weiterbildungsstellen anonym bewerten und die Erfahrungen anderer lesen, um fundierte Karriereentscheidungen zu treffen."
              }
            },
            {
              "@type": "Question",
              "name": "Sind die Bewertungen wirklich anonym?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ja, alle Bewertungen auf dem Assistenz-Ranking sind vollständig anonym. Es werden keine personenbezogenen Daten der Bewertenden gespeichert oder veröffentlicht. Die Anonymität ist technisch und organisatorisch sichergestellt."
              }
            },
            {
              "@type": "Question",
              "name": "Welche Kliniken können bewertet werden?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Auf dem Assistenz-Ranking können Kliniken und Krankenhäuser in Deutschland, Österreich und der Schweiz bewertet werden. Die Plattform deckt alle Fachrichtungen der ärztlichen Weiterbildung im DACH-Raum ab."
              }
            },
            {
              "@type": "Question",
              "name": "Nach welchen Kriterien werden Kliniken bewertet?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Kliniken werden nach folgenden Kriterien bewertet: Weiterbildungsqualität, Arbeitsbelastung, Teamklima, Work-Life-Balance, Mentoring durch Oberärzt*innen und Facharztprüfungsvorbereitung. Jedes Kriterium wird einzeln bewertet für ein differenziertes Gesamtbild."
              }
            },
            {
              "@type": "Question",
              "name": "Wie kann ich eine Klinik bewerten?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Um eine Klinik zu bewerten, klicke auf 'Bewerten' in der Navigation. Die Bewertung erfolgt in drei Schritten: Klinik auswählen, Kriterien bewerten und optional einen anonymen Erfahrungsbericht schreiben. Die Bewertung dauert etwa 3–5 Minuten."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- GoatCounter Analytics (cookie-free, DSGVO-konform, kein Cookie-Banner nötig) -->
    <script data-goatcounter="https://assistenz.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>

    <div id="root">
      <div id="loading-fallback" style="padding:40px;font-family:monospace;font-size:14px;color:#050505">
        <p>Loading Assistenz-Ranking...</p>
        <p>If this message persists, check the browser console (F12 → Console) for errors.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
