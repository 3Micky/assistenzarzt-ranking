name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manueller Start per Button auf github.com

jobs:
  build-ios:
    name: Build iOS (Simulator — unsigned)
    runs-on: macos-14           # Apple Silicon, Xcode 16.2 vorinstalliert
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select Xcode 16.2
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app

      - name: Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_PUBLIC_LAUNCH: 'true'

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -derivedDataPath ios/build
        working-directory: ${{ github.workspace }}

      - name: Build unsigned .app (Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcpretty --color && exit "${PIPESTATUS[0]}"
        working-directory: ${{ github.workspace }}

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: App-Simulator
          path: ios/build/Build/Products/Release-iphonesimulator/App.app
          retention-days: 7
