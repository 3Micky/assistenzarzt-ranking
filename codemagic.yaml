workflows:

  # ── Phase 1: Unsigned Build (kein Apple Developer Account nötig) ─────────
  ios-unsigned:
    name: iOS — Unsigned (Simulator-Test)
    max_build_duration: 30
    environment:
      node: 22
      xcode: 16.2
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_ASSET_SYMBOLS=NO
    artifacts:
      - ios/build/**/*.app

  # ── Phase 2: TestFlight (Apple Developer Account + App Store Connect API nötig) ──
  ios-testflight:
    name: iOS — TestFlight
    max_build_duration: 45
    environment:
      node: 22
      xcode: 16.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.assistenzranking.app
      vars:
        BUNDLE_ID: de.assistenzranking.app
        XCODE_WORKSPACE: ios/App/App.xcodeproj/project.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Set version from build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          NEXT=$((LATEST + 1))
          agvtool new-version -all $NEXT
        working_directory: ios/App

      - name: Build & sign IPA
        script: |
          xcode-project use-profiles
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath ios/build/App.xcarchive \
            GENERATE_ASSET_SYMBOLS=NO \
            archive | xcpretty

          xcodebuild \
            -exportArchive \
            -archivePath ios/build/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath ios/build/ipa | xcpretty

    artifacts:
      - ios/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # publishing wird aktiviert sobald App Store Connect API-Key in
    # Codemagic Team Settings → Integrations → App Store Connect hinterlegt ist.
